---
apiVersion: v1
kind: Namespace
metadata:
  name: go-sample
spec: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-sample
  namespace: go-sample
spec:
  replicas: 1
  selector:
      matchLabels:
        app: go-sample
  template:
    metadata:
      labels:
        app: go-sample
    spec:
      containers:
        - image: asoldatenko/echo-server:0.0.5
          imagePullPolicy: Always
          name: echo-server
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
